spring.application.name=LidyVariedades

# Conexão segura via variáveis de ambiente
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Credenciais administrativas ficam apenas no ambiente, nunca no codigo.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
app.seed.sample-products=${APP_SEED_SAMPLE_PRODUCTS:false}
